# Return user-authored regions and POIs without mixing them with perceived objects.
[contract]
id      = "robonix/system/scene/list_regions"
version = "1"
kind    = "service"
idl     = "semantic_map/srv/ListRegions.srv"
description = "List all registered regions (kind \"region\": a polygon) and POIs (kind \"poi\": one point and a heading) with stable IDs. Use list_objects only for perceived physical objects."

[mode]
type = "rpc"
