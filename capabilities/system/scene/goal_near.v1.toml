# Find a navigation-safe approach pose near a registered scene object.
# Returns map-frame (x, y, yaw) and the same pose as `goal` for navigation/navigate.
[contract]
id      = "robonix/system/scene/goal_near"
version = "1"
kind    = "service"
idl     = "semantic_map/srv/GoalNear.srv"
description = "Compute a navigation-safe approach pose near a known physical scene object. `goal` is that pose as navigation/navigate's goal; it is set only when `reachable` is true, so check `reachable` before navigating to it. Room annotations are not accepted; use robonix/system/scene/goal_region for rooms or named regions."

[mode]
type = "rpc"
