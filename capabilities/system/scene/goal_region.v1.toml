# Find a navigation-safe pose inside a registered region, or at a POI.
# Returns map-frame (x, y, yaw); pass to navigation/navigate after.
[contract]
id      = "robonix/system/scene/goal_region"
version = "1"
kind    = "service"
idl     = "semantic_map/srv/GoalRegion.srv"
description = "Resolve a region annotation to a navigation-safe pose inside its polygon, or a POI to its own pose and heading. Use this for named rooms, regions or POIs before navigation/navigate."

[mode]
type = "rpc"
